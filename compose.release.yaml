name: datapilot

services:
  web:
    image: docker.io/luyukang/datapilot-web:dev
    ports:
      - "127.0.0.1:5173:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: docker.io/luyukang/datapilot-postgres:dev
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics_owner
      POSTGRES_PASSWORD: local-owner-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_owner -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  python-runtime:
    image: docker.io/luyukang/datapilot-python-runtime:dev
    container_name: datapilot-python-runtime
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped

volumes:
  postgres-data:
